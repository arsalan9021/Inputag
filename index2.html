<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>input tag</title>
</head>
<body>
    <table>
        <form>
            <section>

            <h3>Radio</h3>
            <tr>
                <td><label for="male">Male</label></td>
                <td><input type="radio" id="male" name="gender" value="Male"><br></td>

            </tr>

            <tr>
                <td><label for="female">Female</label></td>
                <td><input type="radio" id="female" name="gender" value="Female"></td>
            </tr> 

            <tr>
                <td><label for="other">Other</label></td>
                <td><input type="radio" id="other" name="gender" value="other"></td>
            </tr> 
             </section>
            <hr>
            <section>

            <h3>Checkbox</h3>
            
                       <tr>
                <td><label for="apple">Apple</label></td>
                <td><input type="checkbox" id="apple" name="fruit" value="Apple" ></td>
            </tr>

            <tr>
                <td><label for="banana">Banana</label></td>
                <td><input type="checkbox" id="banana" name="fruit" value="Banana"></td>
            </tr>

            <tr>
                <td><label for="cherry">Cherry</label></td>
                <td><input type="checkbox" id="cherry" name="fruit" value="Cherry"></td>
            </tr>
            </section>

            <td colspan="2" style="text-align: center;">
                <input type="button" value="Click Me"></td>


        </form>
    </table>    
    
</body>
</html>
